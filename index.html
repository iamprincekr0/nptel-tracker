<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NPTEL Weekly Progress</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border: 1px solid #334155; }
    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; color: #38bdf8; text-align: center; }
    p.sub { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    input[type="text"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus, select:focus { border-color: #38bdf8; }
    .checkbox-group { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
    .checkbox-group input { width: 18px; height: 18px; accent-color: #38bdf8; }
    .checkbox-group label { margin: 0; font-size: 0.9rem; cursor: pointer; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #0284c7; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button:active { transform: scale(0.98); background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status-msg { text-align: center; font-size: 0.85rem; margin-top: 12px; display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>NPTEL Progress Tracker</h2>
  <p class="sub">Weekly Assignment & Quiz Status</p>

  <form id="trackerForm">
    <div class="field">
      <label for="studentId">Name / PRN</label>
      <input type="text" id="studentId" placeholder="Enter Name or PRN" required />
    </div>

    <div class="field">
      <label for="week">Select Week</label>
      <select id="week" required>
        <option value="Week 1">Week 1</option>
        <option value="Week 2">Week 2</option>
        <option value="Week 3">Week 3</option>
        <option value="Week 4">Week 4</option>
        <option value="Week 5">Week 5</option>
        <option value="Week 6">Week 6</option>
        <option value="Week 7">Week 7</option>
        <option value="Week 8">Week 8</option>
      </select>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="assignmentDone" />
      <label for="assignmentDone">Assignment Submitted</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="quizDone" />
      <label for="quizDone">Quiz Completed</label>
    </div>

    <button type="submit" id="submitBtn">Submit Status</button>
    <div id="statusMsg" class="status-msg"></div>
  </form>
</div>

<script>
  // ⚠️ IMPORTANT STEP: Yaha apna Apps Script /exec URL paste karo
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwb4Z84p8E-abSCzWb1IxIWWUGRALF473UYR51dUDvzFCy6-i8IRL9zUFV9K7y4c46Mxg/exec";

  const form = document.getElementById('trackerForm');
  const btn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btn.disabled = true;
    btn.innerText = "Submitting...";
    statusMsg.style.display = "none";

    const payload = {
      studentId: document.getElementById('studentId').value.trim(),
      week: document.getElementById('week').value,
      assignmentDone: document.getElementById('assignmentDone').checked,
      quizDone: document.getElementById('quizDone').checked
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusMsg.style.display = "block";
      statusMsg.style.color = "#4ade80";
      statusMsg.innerText = "Status recorded successfully!";
      form.reset();
    })
    .catch(err => {
      statusMsg.style.display = "block";
      statusMsg.style.color = "#f87171";
      statusMsg.innerText = "Submission failed. Please try again.";
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Submit Status";
    });
  });
</script>

</body>
</html>
